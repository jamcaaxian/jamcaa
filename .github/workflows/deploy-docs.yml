name: Deploy docs Site

# Builds and deploys the documentation Site and its counters Worker to
# Cloudflare on every develop push. Credentials come from GitHub Secrets
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); when they are absent the
# workflow verifies but does not deploy. No third-party actions.

on:
    push:
        branches: [develop]
        paths:
            - "apps/docs/**"
            - "packages/**"
            - ".changeset/**"
            - "package.json"
            - "pnpm-lock.yaml"

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - name: Check out the repository
              run: git clone --depth 1 --branch develop "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

            - name: Prepare pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10.34.5 --activate
                  pnpm install --frozen-lockfile

            - name: Verify
              run: |
                  CI='1' pnpm format:check
                  pnpm lint
                  pnpm typecheck

            - name: Deploy the docs Site
              if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
              run: pnpm --filter @jamcaa/docs run deploy

            - name: Deploy the counters Worker
              if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
              run: pnpm --filter @jamcaa/docs exec wrangler deploy --config wrangler.counters.jsonc
